<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#143d38">
  <title>Torah recordings</title>
  <link rel="stylesheet" href="./style.css">
  <script type="module" src="./app.js"></script>
</head>
<body>
  <main>
    <section aria-label="Recording library" class="library">
      <p id="status" role="status" aria-live="polite">Loading recordings…</p>
      <div class="table-wrap"><table><thead><tr><th scope="col">Name</th><th scope="col">Recorded · Pacific time</th><th scope="col">Playback</th></tr></thead><tbody id="recordings"></tbody></table></div>
    </section>
    <section id="player-panel" class="player" hidden aria-label="Recording player"><div><span class="eyebrow">NOW PLAYING</span><h2 id="playing-name"></h2></div><audio id="audio" controls preload="none"></audio><p id="playback-status" role="status"></p><a id="open-recording" target="_blank" rel="noopener noreferrer">Open recording</a></section>
    <footer><span id="version">v1.1.1</span></footer>
  </main>
</body>
</html>
